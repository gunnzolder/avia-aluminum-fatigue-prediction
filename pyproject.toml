[project]
name = "afml"
version = "0.1.0"
description = "ML prediction of fatigue characteristics of aviation aluminum alloys"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "plotly>=6",
    "streamlit>=1.39",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "kaleido>=1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
